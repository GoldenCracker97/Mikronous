# Mikronous Hermes profile — installed to ~/.hermes/profiles/mikronous/config.yaml
# Secrets (API_SERVER_KEY etc.) live in .env next to this file, never here.
# Reference: https://github.com/NousResearch/hermes-agent/blob/main/cli-config.yaml.example

# ---------------------------------------------------------------------------
# Model: a llama-server we run ourselves on :8081 (systemd/mikronous-llama.service).
# `mik model` (Phase 0.5) rewrites the llama-server flags to fit the hardware;
# the model alias below stays stable so this file does not change.
# ---------------------------------------------------------------------------
model:
  provider: llamacpp
  default: mikronous-local

providers:
  llamacpp:
    base_url: http://127.0.0.1:8081/v1
    model: mikronous-local

local_runtime:
  enabled: false          # we manage llama-server via systemd, not Hermes
  detect_ports: [8081]

# ---------------------------------------------------------------------------
# Full Hermes functionality: each platform's own composite toolset plus the
# mikronous desktop toolset from our plugin. (A "*" wildcard is ignored when a
# plugin toolset is also listed, so name the composite explicitly.)
# agent.disabled_toolsets below removes the paid-key toolsets afterwards.
# ---------------------------------------------------------------------------
platform_toolsets:
  api_server: [hermes-api-server, mikronous]
  cli: [hermes-cli, mikronous]
  cron: [hermes-cron, mikronous]

# ---------------------------------------------------------------------------
# Internet: keyless. DuckDuckGo for search (no key); page extraction falls back
# to Hermes's keyless free-tier ring (Exa / Parallel / Firecrawl / Keenable).
# Swap in SEARXNG_URL + `search_backend: searxng` for fully private search.
# ---------------------------------------------------------------------------
web:
  search_backend: ddgs
  keyless_fallback: true

# ---------------------------------------------------------------------------
# Long-term memory of the user (MEMORY.md + USER.md in this profile).
# ---------------------------------------------------------------------------
memory:
  memory_enabled: true
  user_profile_enabled: true
  nudge_interval: 10

# Cron jobs (reminders) run on the same local model.
cron:
  model: mikronous-local
  model_provider: llamacpp

plugins:
  enabled: [mikronous]

# Keep every tool visible to the model. Hermes otherwise hides non-core plugin tools
# (ours: set_reminder, desktop_notify, ...) and some built-ins behind a tool_search
# bridge, and small local models then emulate them with terminal commands instead.
tools:
  tool_search:
    enabled: "off"

# ---------------------------------------------------------------------------
# Local-only guarantees. Nothing here can enrol the user in a paid service:
# - no fallback_providers / auxiliary overrides: side tasks use the local model or are skipped
# - never borrow Claude Code / Codex logins found on the machine
# - telemetry collection and upload both off (Hermes default, pinned)
# - toolsets that only work with paid API keys or Nous-managed connectors are removed
#   everywhere. `mik privacy offline` additionally removes web + browser.
# ---------------------------------------------------------------------------
auth:
  adopt_external_logins: false

telemetry:
  shared_metrics:
    enabled: false
    send: false

agent:
  # cronjob is hidden on purpose: set_reminder (our plugin) is the only scheduler the model
  # sees. The cron engine itself keeps running; `hermes cron` and /cron still work for you.
  disabled_toolsets: [connections, image_gen, video_gen, video, tts, x_search, vision, cronjob]

# The mikronous platform (our plugin) is where cron reminders are delivered.
platforms:
  mikronous:
    enabled: true
    gateway_restart_notification: false   # per-platform flag: no "Gateway online" popup on restarts

# Run this profile's gateway as its own process (hermes-gateway-mikronous.service) instead of
# inside the shared host gateway. Verified on Hermes 0.21.x: the multiplexed host never loaded
# this profile's plugin (no mikronous tools, no hooks, no platform), while a per-profile process
# does. Hermes calls this key a temporary compatibility shim; revisit when the gap is closed.
gateway:
  standalone: true
