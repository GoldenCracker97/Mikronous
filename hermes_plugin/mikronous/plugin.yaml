name: mikronous
label: Mikronous Desktop
kind: platform
version: 0.2.0
description: "KDE Plasma desktop integration for Hermes: notifications, app/URL launching, clipboard, media and system control, local notes, local document search, network tools, and a delivery platform for reminders."
author: GoldenCracker97
# Client tools the agent can call from any session (registered from __init__.register; see there).
provides_tools:
  - desktop_notify
  - desktop_open
  - clipboard
  - notes_manage
  - docs_search
  - set_reminder
  - lan_devices
  - host_check
  - wake_on_lan
  - http_request
  - media_control
  - system_control
provides_hooks:
  - pre_tool_call
  - on_session_end
optional_env:
  - name: MIKRONOUS_HOME_CHANNEL
    description: "Default delivery target for deliver=mikronous cron jobs (any label; there is one desktop)"
    password: false
  - name: MIKRONOUS_DOCS_DIRS
    description: "Colon-separated folders indexed by docs_search (default ~/Documents)"
    password: false
  - name: MIKRONOUS_NOTES_DIR
    description: "Where notes_manage keeps its markdown notes (default ~/Mikronous/notes)"
    password: false
