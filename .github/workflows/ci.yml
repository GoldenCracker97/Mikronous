name: CI

on:
  push:
    branches: [Main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (offscreen tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install
        run: python -m pip install --quiet -e ".[tray,dev]"
      - name: Shell syntax and bytecode
        run: |
          bash -n scripts/install.sh scripts/install-llama.sh scripts/fetch-model.sh
          python -m compileall -q mikronous_cli mikronous_tray mikronous_model hermes_plugin
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
